<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 190" width="880" height="190">
  <defs>
    <!-- Seamless Repeating Neon Gradient (Zero Loop Jump) -->
    <linearGradient id="cyberGrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="880" y2="0" spreadMethod="repeat">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="75%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <!-- Change dur="5s" below to speed up or slow down the gradient sweep -->
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="0 0"
        to="880 0"
        dur="5s"
        repeatCount="indefinite"
      />
    </linearGradient>

    <!-- Multi-Pass Neon Bloom Filter -->
    <filter id="neonGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="2.5" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    /* =========================================
       SPEED MODIFIERS (Lower = Faster)
       ========================================= */
    svg {
      --glitch-speed: 2.2s;   /* How often the RGB glitch fires */
      --breathe-speed: 3s;    /* Neon glow pulse speed */
    }

    .ascii-main {
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 14px;
      font-weight: 700;
      fill: url(#cyberGrad);
      filter: url(#neonGlow);
      animation: breathe var(--breathe-speed) ease-in-out infinite alternate;
    }

    .ascii-glitch-cyan {
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 14px;
      font-weight: 700;
      fill: #38bdf8;
      opacity: 0;
      animation: glitchLeft var(--glitch-speed) infinite;
    }

    .ascii-glitch-magenta {
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 14px;
      font-weight: 700;
      fill: #e879f9;
      opacity: 0;
      animation: glitchRight var(--glitch-speed) infinite;
    }

    .hud-bracket {
      fill: none;
      stroke: url(#cyberGrad);
      stroke-width: 2;
      stroke-linecap: round;
      filter: url(#neonGlow);
    }

    @keyframes breathe {
      0% { opacity: 0.85; }
      100% { opacity: 1; }
    }

    /* Double-hit glitch burst within each --glitch-speed cycle */
    @keyframes glitchLeft {
      0%, 72%, 78%, 84%, 90%, 100% { opacity: 0; transform: translate(0, 0); }
      74% { opacity: 0.85; transform: translate(-5px, -1px); }
      76% { opacity: 0.7; transform: translate(3px, 1px); }
      86% { opacity: 0.9; transform: translate(-6px, 0px); }
      88% { opacity: 0.65; transform: translate(4px, -1px); }
    }

    @keyframes glitchRight {
      0%, 72%, 78%, 84%, 90%, 100% { opacity: 0; transform: translate(0, 0); }
      74% { opacity: 0.85; transform: translate(5px, 1px); }
      76% { opacity: 0.7; transform: translate(-3px, -1px); }
      86% { opacity: 0.9; transform: translate(6px, 0px); }
      88% { opacity: 0.65; transform: translate(-4px, 1px); }
    }
  </style>

  <!-- Subtle Scanline Overlay -->
  <rect x="20" y="15" width="840" height="160" rx="12" fill="url(#scanlines)"/>

  <!-- Glowing HUD Corner Brackets -->
  <path d="M 20 40 L 20 15 L 45 15" class="hud-bracket"/>
  <path d="M 835 15 L 860 15 L 860 40" class="hud-bracket"/>
  <path d="M 20 150 L 20 175 L 45 175" class="hud-bracket"/>
  <path d="M 835 175 L 860 175 L 860 150" class="hud-bracket"/>

  <!-- RGB Chromatic Glitch Ghost Layers -->
  <g class="ascii-glitch-cyan">
    <text x="440" y="48" text-anchor="middle" xml:space="preserve">      _                   _  __         _     _         ____          _           </text>
    <text x="440" y="66" text-anchor="middle" xml:space="preserve">     | | __ _ _   _ _   _| |/ /__ _ ___| |__ | |_ __ _ / ___|___   __| | ___  ___ </text>
    <text x="440" y="84" text-anchor="middle" xml:space="preserve">  _  | |/ _` | | | | | | | ' // _` / __| '_ \| __/ _` | |   / _ \ / _` |/ _ \/ __|</text>
    <text x="440" y="102" text-anchor="middle" xml:space="preserve"> | |_| | (_| | |_| | |_| | . \ (_| \__ \ | | | || (_| | |__| (_) | (_| |  __/\__ \</text>
    <text x="440" y="120" text-anchor="middle" xml:space="preserve">  \___/ \__,_|\__, |\__, |_|\_\__,_|___/_| |_|\__\__,_|\____\___/ \__,_|\___||___/</text>
    <text x="440" y="138" text-anchor="middle" xml:space="preserve">              |___/ |___/                                                         </text>
  </g>

  <g class="ascii-glitch-magenta">
    <text x="440" y="48" text-anchor="middle" xml:space="preserve">      _                   _  __         _     _         ____          _           </text>
    <text x="440" y="66" text-anchor="middle" xml:space="preserve">     | | __ _ _   _ _   _| |/ /__ _ ___| |__ | |_ __ _ / ___|___   __| | ___  ___ </text>
    <text x="440" y="84" text-anchor="middle" xml:space="preserve">  _  | |/ _` | | | | | | | ' // _` / __| '_ \| __/ _` | |   / _ \ / _` |/ _ \/ __|</text>
    <text x="440" y="102" text-anchor="middle" xml:space="preserve"> | |_| | (_| | |_| | |_| | . \ (_| \__ \ | | | || (_| | |__| (_) | (_| |  __/\__ \</text>
    <text x="440" y="120" text-anchor="middle" xml:space="preserve">  \___/ \__,_|\__, |\__, |_|\_\__,_|___/_| |_|\__\__,_|\____\___/ \__,_|\___||___/</text>
    <text x="440" y="138" text-anchor="middle" xml:space="preserve">              |___/ |___/                                                         </text>
  </g>

  <!-- Main Illuminated Neon ASCII Text -->
  <g class="ascii-main">
    <text x="440" y="48" text-anchor="middle" xml:space="preserve">      _                   _  __         _     _         ____          _           </text>
    <text x="440" y="66" text-anchor="middle" xml:space="preserve">     | | __ _ _   _ _   _| |/ /__ _ ___| |__ | |_ __ _ / ___|___   __| | ___  ___ </text>
    <text x="440" y="84" text-anchor="middle" xml:space="preserve">  _  | |/ _` | | | | | | | ' // _` / __| '_ \| __/ _` | |   / _ \ / _` |/ _ \/ __|</text>
    <text x="440" y="102" text-anchor="middle" xml:space="preserve"> | |_| | (_| | |_| | |_| | . \ (_| \__ \ | | | || (_| | |__| (_) | (_| |  __/\__ \</text>
    <text x="440" y="120" text-anchor="middle" xml:space="preserve">  \___/ \__,_|\__, |\__, |_|\_\__,_|___/_| |_|\__\__,_|\____\___/ \__,_|\___||___/</text>
    <text x="440" y="138" text-anchor="middle" xml:space="preserve">              |___/ |___/                                                         </text>
  </g>
</svg>
