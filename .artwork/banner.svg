<svg xmlns="http://w3.org" viewBox="0 0 840 160" width="100%">
  <defs>
    <linearGradient id="neonSweep" x1="0%" y1="0%" x2="200%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#e879f9"/>
      <stop offset="75%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
      <animateTransform
        attributeName="gradientTransform"
        type="translate"
        from="-1 0"
        to="0 0"
        dur="4s"
        repeatCount="indefinite"
      />
    </linearGradient>

    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    .ascii {
      font-family: 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
      font-size: 14px;
      font-weight: 700;
      fill: url(#neonSweep);
      white-space: pre;
      filter: url(#glow);
      animation: pulse 3s ease-in-out infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.85; }
      100% { opacity: 1; }
    }
  </style>

  <text x="50%" y="32" text-anchor="middle" class="ascii" xml:space="preserve">      _                   _  __         _     _         ____          _           </text>
  <text x="50%" y="50" text-anchor="middle" class="ascii" xml:space="preserve">     | | __ _ _   _ _   _| |/ /__ _ ___| |__ | |_ __ _ / ___|___   __| | ___  ___ </text>
  <text x="50%" y="68" text-anchor="middle" class="ascii" xml:space="preserve">  _  | |/ _` | | | | | | | ' // _` / __| '_ \| __/ _` | |   / _ \ / _` |/ _ \/ __|</text>
  <text x="50%" y="86" text-anchor="middle" class="ascii" xml:space="preserve"> | |_| | (_| | |_| | |_| | . \ (_| \__ \ | | | || (_| | |__| (_) | (_| |  __/\__ \</text>
  <text x="50%" y="104" text-anchor="middle" class="ascii" xml:space="preserve">  \___/ \__,_|\__, |\__, |_|\_\__,_|___/_| |_|\__\__,_|\____\___/ \__,_|\___||___/</text>
  <text x="50%" y="122" text-anchor="middle" class="ascii" xml:space="preserve">              |___/ |___/                                                         </text>
</svg>
